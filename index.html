<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Primary Meta Tags -->
  <title>RISETOGETHER – Goldenroot Successors AI Portal</title>
  <meta name="title" content="RISETOGETHER – Goldenroot Successors AI Portal">
  <meta name="description" content="Connect with our AI-powered assistant and advisory platform by Goldenroot Successors to streamline goals, plan securely, and grow together.">
  <meta name="keywords" content="Goldenroot Successors, RISETOGETHER, AI Agent, Financial Advisory, Tata AIA Partner">
  <meta name="author" content="Goldenroot Successors">

  <!-- Open Graph / Facebook / WhatsApp Preview Cards -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://risetogether.netlify.app/">
  <meta property="og:title" content="RISETOGETHER – Goldenroot Successors AI Portal">
  <meta property="og:description" content="Streamline your goals and connect with Goldenroot Successors through our smart AI assistant.">
  <meta property="og:image" content="https://risetogether.netlify.app/risetogether-banner.png">

  <!-- Fonts & Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Noto+Sans+Devanagari:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap");
    :root{--bg:#050b24;--card:#0c1740;--ink:#f4ecd2;--sea:#b4c0ff;--gold:#ffd45a;--line:#26397a;--ok:#6fe0a4;--bad:#ff8a80;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3","Noto Sans Devanagari",system-ui,sans-serif}
    main{max-width:600px;margin:0 auto;padding:18px 16px 40px}
    h1,h2{font-family:Fraunces,"Noto Sans Devanagari",Georgia,serif;line-height:1.2;margin:.3em 0 .4em}
    h1{font-size:32px;font-weight:800;letter-spacing:.04em;color:var(--gold);text-shadow:0 0 20px rgba(255,201,60,.35)}
    h2{font-size:22px;text-shadow:0 0 20px rgba(255,201,60,.35)}
    .brand{font-weight:600;color:var(--gold);font-size:13px;letter-spacing:1px;text-transform:uppercase}
    .sub{font-size:18px}
    .bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 18px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb300,#ffe38f);box-shadow:0 0 10px rgba(255,201,60,.6);border-radius:3px}
    .tag{display:inline-block;font-size:13px;font-weight:600;color:var(--sea);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-bottom:10px}
    
    /* AI Pathway Guide Box with Voice Button */
    .ai-guide-box{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0c1740,#142468);border:1px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:18px;box-shadow:0 0 25px rgba(255,201,60,.2);position:relative}
    .ai-avatar{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd45a,#d49811);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 0 15px rgba(255,201,60,.5);animation:glowAvatar 3s ease-in-out infinite}
    @keyframes glowAvatar{0%,100%{box-shadow:0 0 15px rgba(255,201,60,.4)}50%{box-shadow:0 0 25px rgba(255,201,60,.8)}}
    .ai-speech{font-size:15px;line-height:1.4;color:var(--ink);flex:1}
    .voice-btn{background:none;border:1px solid var(--gold);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;padding:0;color:var(--gold);transition:transform 0.2s}
    .voice-btn:hover{transform:scale(1.1)}

    /* Equal height visualizer bars */
    .audio-viz{display:flex;align-items:center;gap:3px;height:16px;margin-top:6px}
    .audio-viz i{display:block;width:3px;height:100%;background:var(--gold);border-radius:2px;animation:viz 1s ease-in-out infinite alternate;transform-origin:bottom}
    .audio-viz i:nth-child(2){animation-delay:0.2s}.audio-viz i:nth-child(3){animation-delay:0.4s}.audio-viz i:nth-child(4){animation-delay:0.1s}
    @keyframes viz{0%{transform:scaleY(0.2)}100%{transform:scaleY(1)}}

    .opts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
    button,input,select{font:inherit;color:var(--ink)}
    button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:border-color .2s}
    button:hover{border-color:var(--sea)}
    button.go{background:linear-gradient(135deg,#ffe38f,#ffb300);border-color:#ffd45a;color:#1a1200;font-weight:600;text-align:center;margin:8px 0;width:100%}
    .langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.langs button{text-align:center;padding:10px 6px}
    .mirror{background:linear-gradient(160deg,#0f1c4d,#0a1338);border-radius:10px;padding:14px;margin:14px 0;border:1px solid var(--line);box-shadow:0 0 22px rgba(110,90,255,.18)}
    label{display:block;margin:12px 0 4px;font-weight:600}
    input,select,textarea{width:100%;box-sizing:border-box;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px}
    .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.chk input{width:22px;height:22px;margin-top:3px}
    .err{color:var(--bad);font-weight:600;min-height:1.2em}
    .irow{display:flex;gap:8px;align-items:center}
    .mic{width:46px;height:46px;flex-shrink:0;background:var(--card);border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
    .mic.on{border-color:var(--gold);box-shadow:0 0 12px rgba(255,201,60,.45)}
    /* Footer Profile Links */
    .portal-footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:14px;opacity:0.85}
    .portal-footer a{color:var(--gold);text-decoration:none;font-weight:600;margin:0 8px}
    .portal-footer a:hover{text-decoration:underline}

    @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,201,60,0)}50%{box-shadow:0 0 24px rgba(255,201,60,.5)}}
    #app>*{animation:sl .75s cubic-bezier(.2,.8,.2,1) both}
    @keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <main id="app"></main>

  <script>
    const WA="917018400069";
    let L='en',S={d:{}},activeSpeechText="";

    const RDY=[["English","English","en"],["Hindi","हिन्दी","hi"]];
    const T={
      en:{
        brand:"Goldenroot Successors",h1:"RISETOGETHER Portal",tag:"Smart AI Advisory & Information Gathering",
        sub:"Let's map out your growth trajectory with intelligent guidance.",stepIn:"Begin Journey",
        discH:"Welcome to RISETOGETHER",disc:"Brought to you by Goldenroot Successors. This portal connects you with tailored financial guidance, smart planning tools, and professional solutions. Your data remains strictly secure.",ok:"I understand, continue",
        aiHello:"Namaste! I am your AI guide. I am here to show you a smooth pathway through our portal. Let's begin!",
        aiForm:"Please share your name and mobile number so Goldenroot Successors can share personalized updates with you.",
        aiDone:"Wonderful! Your details are ready to be sent directly to our advisors on WhatsApp.",
        qm:"What is your primary monthly growth target?",mO:["₹25,000","₹50,000","₹1,00,000","₹2,00,000 or more"],cont:"Continue",
        fm:"Your Professional Details",nm:"Full name",mb:"WhatsApp / Mobile Number",cs:"I agree that Goldenroot Successors may contact me with relevant advisory updates.",
        sub2:"Submit & Connect on WhatsApp",dH:"You have successfully completed the path!",dT:"WhatsApp has been prepared with your summary. Click below to send.",
        err:"Please fill in your name, valid mobile number, and consent."
      },
      hi:{
        brand:"गोल्डन रूट सक्सेसर्स",h1:"RISETOGETHER पोर्टल",tag:"स्मार्ट एआई एडवाइजरी और इनफॉरमेशन पोर्टल",
        sub:"आइए बुद्धिमान मार्गदर्शन के साथ आपकी विकास यात्रा को आगे बढ़ाएं।",stepIn:"यात्रा शुरू करें",
        discH:"RISETOGETHER में आपका स्वागत है",disc:"गोल्डन रूट सक्सेसर्स द्वारा प्रस्तुत। यह पोर्टल आपको अनुरूप वित्तीय मार्गदर्शन और स्मार्ट योजना टूल से जोड़ता है।",ok:"मैं समझता हूँ, आगे बढ़ें",
        aiHello:"नमस्ते! मैं आपकी एआई गाइड हूँ। मैं इस पोर्टल के माध्यम से आपका मार्गदर्शन करने के लिए यहाँ हूँ। आइए शुरू करें!",
        aiForm:"कृपया अपना नाम और मोबाइल नंबर साझा करें ताकि हम आपके साथ व्यक्तिगत अपडेट साझा कर सकें।",
        aiDone:"बहुत बढ़िया! आपका विवरण व्हाट्सएप पर सीधे हमारे सलाहकारों को भेजने के लिए तैयार है।",
        qm:"आपका प्राथमिक मासिक विकास लक्ष्य क्या है?",mO:["₹25,000","₹50,000","₹1,00,000","₹2,00,000 या अधिक"],cont:"जारी रखें",
        fm:"आपका विवरण",nm:"पूरा नाम",mb:"व्हाट्सएप / मोबाइल नंबर",cs:"मैं सहमत हूँ कि गोल्डन रूट सक्सेसर्स मुझसे संपर्क कर सकता है।",
        sub2:"सबमिट करें और व्हाट्सएप पर भेजें",dH:"आपने सफलतापूर्वक प्रक्रिया पूरी कर ली है!",dT:"व्हाट्सएप पर आपका विवरण तैयार है। भेजने के लिए नीचे क्लिक करें।",
        err:"कृपया अपना नाम, वैध मोबाइल नंबर और सहमति बॉक्स भरें।"
      }
    };

    function t(){ return T[L]; }

    // Text-to-Speech Engine configured for Indian Female Voice Pitch/Accent
    function speakAIGuide(text){
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // Stop active speech
      
      activeSpeechText = text || activeSpeechText;
      if(!activeSpeechText) return;

      const utterance = new SpeechSynthesisUtterance(activeSpeechText);
      const voices = window.speechSynthesis.getVoices();
      
      // Look for an Indian female voice profile in browser/system
      let selectedVoice = voices.find(v => 
        (v.lang.includes('en-IN') || v.lang.includes('hi-IN')) && 
        (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('heera') || v.name.toLowerCase().includes('kalpana') || v.name.toLowerCase().includes('veena'))
      );

      if(!selectedVoice){
        selectedVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('hi-IN'));
      }

      if(selectedVoice) utterance.voice = selectedVoice;
      
      utterance.lang = L === 'hi' ? 'hi-IN' : 'en-IN';
      utterance.rate = 0.92;  // Soft, clear pacing
      utterance.pitch = 1.2;  // Warm, pleasant tone
      
      window.speechSynthesis.speak(utterance);
    }

    // Ensure voices are loaded properly in Chrome/Safari
    if('speechSynthesis' in window){
      window.speechSynthesis.onvoiceschanged = () => {
        if(activeSpeechText) speakAIGuide(activeSpeechText);
      };
    }

    function renderAIGuide(msgKey){
      const text = t()[msgKey] || t().aiHello;
      activeSpeechText = text;
      
      // Auto-trigger voice guide upon render
      setTimeout(() => speakAIGuide(text), 300);

      return `
        <div class="ai-guide-box">
          <div class="ai-avatar" title="AI Pathway Guide">👩🏽‍💼</div>
          <div class="ai-speech">
            <span class="brand">Goldenroot AI Guide</span><br>
            ${text}
          </div>
          <button class="voice-btn" onclick="speakAIGuide()" title="Listen / Repeat Voice">🔊</button>
        </div>
      `;
    }

    function pickLang(){
      app.innerHTML=`
        <div class="bar"><i></i></div>
        <div class="brand">Goldenroot Successors</div>
        <h2>Choose your language / भाषा चुनें</h2>
        <div class="langs" id="lg" style="margin-top:20px;"></div>
      `;
      const g=document.getElementById('lg');
      RDY.forEach(([n,nat,c])=>{
        const b=document.createElement('button');
        b.textContent=nat;
        b.onclick=()=>{ L=c; intro(); };
        g.appendChild(b);
      });
    }

    function intro(){
      app.innerHTML=`
        <div class="bar"><i style="width:15%"></i></div>
        <div class="brand">${t().brand}</div>
        <h1>${t().h1}</h1>
        <span class="tag">${t().tag}</span>
        ${renderAIGuide('aiHello')}
        <p class="sub">${t().sub}</p>
        <button class="go" onclick="disclose()">${t().stepIn}</button>
      `;
    }

    function disclose(){
      app.innerHTML=`
        <div class="bar"><i style="width:35%"></i></div>
        <div class="brand">${t().brand}</div>
        <h2>${t().discH}</h2>
        <div class="mirror"><p>${t().disc}</p></div>
        <button class="go" onclick="questionGoal()">${t().ok}</button>
      `;
    }

    function questionGoal(){
      app.innerHTML=`
        <div class="bar"><i style="width:65%"></i></div>
        <div class="brand">${t().brand}</div>
        <h2>${t().qm}</h2>
        <div class="opts" id="opts"></div>
      `;
      const o=document.getElementById('opts');
      t().mO.forEach(opt=>{
        const b=document.createElement('button');
        b.textContent=opt;
        b.onclick=()=>{ S.d.goal=opt; form(); };
        o.appendChild(b);
      });
    }

    function form(){
      app.innerHTML=`
        <div class="bar"><i style="width:90%"></i></div>
        <div class="brand">${t().brand}</div>
        <h2>${t().fm}</h2>
        ${renderAIGuide('aiForm')}
        <label>${t().nm}</label><input id="nm" type="text" placeholder="Enter Full Name">
        <label>${t().mb}</label><input id="mb" type="tel" placeholder="10-digit Mobile / WhatsApp Number">
        <label class="chk"><input id="cs" type="checkbox">${t().cs}</label>
        <button class="go" onclick="submitData()">${t().sub2}</button>
        <p class="err" id="er"></p>
      `;
    }

    function submitData(){
      const name=document.getElementById('nm').value.trim();
      const mob=document.getElementById('mb').value.trim();
      const consent=document.getElementById('cs').checked;
      
      if(!name || mob.length<10 || !consent){
        document.getElementById('er').textContent=t().err;
        return;
      }
      
      app.innerHTML=`
        <div class="bar"><i style="width:100%"></i></div>
        <div class="brand">${t().brand}</div>
        <h2>${name}, ${t().dH}</h2>
        ${renderAIGuide('aiDone')}
        <p class="sub">${t().dT}</p>
        <button class="go" onclick="window.open('https://wa.me/${WA}?text='+encodeURIComponent('Hi Goldenroot Successors, I am ${name} (${mob}). My monthly target goal is ${S.d.goal || 'Not specified'}. Ready to RISE TOGETHER!'))">Open WhatsApp & Submit</button>
        
        <div class="portal-footer">
          <a href="https://sarla17.tataaiapartner.com/" target="_blank">Tata AIA Partner Portal</a> | 
          <a href="https://www.facebook.com/share/19aT1vEcG9/" target="_blank">Facebook Profile</a>
        </div>
      `;
    }

    // Initialize application
    pickLang();
  </script>
</body>
</html>
