:root[data-theme="dark"]{--bg:#050b24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3","Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:18px 16px 40px}

.tag{display:inline-block;font-size:14px;font-weight:600;color:var(--sea);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.opts{display:flex;flex-direction:column;gap:10px;margin:16px 0}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 50% 6%,rgba(255,201,60,.24),transparent 70%),radial-gradient(50% 40% at 88% 88%,rgba(110,90,255,.26),transparent 70%),radial-gradient(45% 35% at 8% 72%,rgba(255,140,60,.13),transparent 70%);animation:drift 26s ease-in-out infinite alternate}

.aff p{color:#fff2c4;text-shadow:0 0 22px rgba(255,201,60,.45)}
.logo{max-width:320px;width:85%;box-shadow:0 0 36px rgba(255,201,60,.35)}

#app>*{animation:sl .75s cubic-bezier(.2,.8,.2,1) both}

whyQ:"GoldenRoot Successors के साथ क्यों?",why:["पहले लाइसेंस। हम आपको आधिकारिक लाइसेंस प्रक्रिया तक पहुँचाते हैं और निजी खाते में लाइसेंस का पैसा कभी नहीं लेते।","काम करने वाले लोगों से आपकी भाषा में प्रशिक्षण और मार्गदर्शन।","टूल्स और लीड सहयोग ताकि आपका समय कागज़ी काम में नहीं, बातचीत में लगे।","ईमानदार बिक्री। पहले ज़रूरत, कोई झूठा वादा नहीं। ऐसे ही कारोबार टिकता है।"],whyC:"अपनी जानकारी छोड़ें, GoldenRoot का मार्गदर्शक आपसे संपर्क करेगा। सिर्फ गंभीर लोग, कृपया।",enter:"मेरी जानकारी भरें",
fm:"आपकी जानकारी",nm:"पूरा नाम",ag:"उम्र",pf:"पेशा",pfO:["नौकरीपेशा","गृहिणी","छात्र","रिटायर्ड"],sel:"चुनें",mb:"मोबाइल नंबर",same:"व्हाट्सऐप नंबर वही है जो मोबाइल है",wa:"व्हाट्सऐप नंबर",em:"ईमेल",lc:"शहर और राज्य",cs:"मैं सहमत हूँ कि GoldenRoot Successors मुझसे कॉल, व्हाट्सऐप और ईमेल पर संपर्क कर सकता है।",
e:["अपना पूरा नाम भरें।","अपनी उम्र भरें।","सलाहकार लाइसेंस के लिए उम्र 18 या उससे ऊपर होनी चाहिए। 18 के होने पर लौटें।","अपना पेशा चुनें।","सही 10 अंकों का मोबाइल नंबर भरें।","सही 10 अंकों का व्हाट्सऐप नंबर भरें।","सही ईमेल भरें।","अपना शहर और राज्य भरें।","संपर्क की अनुमति के लिए सहमति बॉक्स पर टिक करें।"],
sub2:"जमा करें और व्हाट्सऐप पर भेजें",dH:"आपने कदम बढ़ा दिया है।",dT:"व्हाट्सऐप आपकी पूरी शीट के साथ खुल गया। वहाँ Send दबाएँ ताकि GoldenRoot को मिल जाए।",d1:"व्हाट्सऐप पर फिर भेजें",d2:"दस्तावेज़ डाउनलोड करें (.txt)",d3:"स्प्रेडशीट डाउनलोड करें (.csv)",d4:"जानकारी कॉपी करें",saved:"सेव हो गया।",cancel:"सेव रद्द।",nodl:"यहाँ फ़ाइल सेव उपलब्ध नहीं है। कॉपी या व्हाट्सऐप इस्तेमाल करें।",copied:"कॉपी हो गया।",
last:"आगे, GoldenRoot का मार्गदर्शक आपको आधिकारिक लाइसेंस प्रक्रिया में मदद करेगा। लाइसेंस फीस कभी किसी व्यक्ति को न दें।",lk:"लाख",cr:"करोड़","st": "राज्य / केंद्र शासित प्रदेश", "di": "ज़िला", "ci": "शहर, कस्बा या गाँव", "other": "अन्य (खुद लिखें)", "typeDist": "अपना ज़िला लिखें", "typeCity": "अपना शहर या कस्बा लिखें", "eLoc": "अपना राज्य और ज़िला चुनें, और शहर लिखें।", "affBtn": "आगे", "aff": ["{n}, एक गहरी साँस लीजिए।", "महसूस कीजिए कि उस इंसान को कैसा लगता है जिसने आख़िरकार आगे बढ़ने का फैसला कर लिया।", "ज़्यादातर लोग सही समय का इंतज़ार करते रहते हैं। आपने खुद एक सही पल बना दिया।", "आज आप इंतज़ार से निकलकर कर्म में आ गए।", "जिन सपनों का आपने नाम लिया, घर, सफ़र, और अपनों के लिए आज़ादी, वे आज थोड़े और पास आ गए।", "अब एक नई सोच शुरू होती है: मैं सीख सकता/सकती हूँ। मैं आगे बढ़ सकता/सकती हूँ। मैं बना सकता/सकती हूँ।", "हर ईमानदार बातचीत के साथ हुनर बढ़ता है, और उसके साथ आपका आत्मविश्वास भी।", "आप वही इंसान नहीं हैं जिसने यह पन्ना खोला था।", "दरवाज़ा खुला है, और आप उससे गुज़र रहे हैं।", "सफलता एक-एक स्थिर दिन से बनती है, और आज आपने पहला पत्थर रख दिया। आपकी शुरुआत में स्वागत है।"]}};
const QL={en:[
["IRDAI basics","A relative says, 'IRDAI is a private company that sells insurance.' Is that right?",["Yes","No. It is the government regulator that licenses agents and protects policyholders","It only handles motor claims"],1,"IRDAI is the Insurance Regulatory and Development Authority of India, the statutory regulator. Licensing, conduct rules and policyholder protection all come from it."],
["IRDAI basics","Sunita sells policies for a cousin's firm without a licence because 'it is just family'. What is the risk?",["None","Selling without a valid licence is illegal and can bring penalties and ruin trust","Only a warning letter"],1,"Only a licensed agent may sell insurance. Family does not change that, and an unlicensed seller has no protection if something goes wrong."],
["Branches","Arjun's bike is stolen from his parking. Which branch of insurance pays?",["Life","General (motor)","Health"],1,"General insurance covers things and liabilities: motor, home, fire, travel, marine, crop."],
["Branches","A 35-year-old with two kids and a home loan dies suddenly. Which cover protects the family's income?",["Term life","Travel","Fire"],0,"Term life is pure protection. A modest premium buys a large cover that replaces income for the family."],
["Branches","Mrs Iyer needs a ₹4 lakh surgery. Which cover helps?",["Health insurance","Marine","Crop"],0,"Health insurance pays hospital costs. It is sold by general insurers and standalone health insurers."],
["Branches","Which of these is NOT a general insurance product?",["Home or fire","Travel","Term life"],2,"Term life belongs to life insurance. Knowing the branches lets you place every client need in the right basket."],
["Premium rules","A client says, 'Take the cash now, I will sort out the receipt later.' What is your move?",["Accept it and pay the insurer later","Take payment only through the insurer's official channel, with an official receipt","Ask him to pay your personal UPI"],1,"Premium belongs to the insurer. Never collect it into a personal account or without an official receipt. Mixing money is the fastest way to lose your licence."],
["Premium rules","On a premium cheque or UPI payment, whose name should the payee show?",["The agent's","The insurer's","The agent's company"],1,"Always the insurer. If a payment link shows your name, stop and report it."],
["Premium rules","Raju's car policy cheque has not cleared, and he has an accident the same day. What generally applies?",["He is covered anyway","In general insurance, cover normally starts only when the premium is received","The insurer pays double"],1,"The principle is 'no premium, no risk cover'. Tell clients clearly so a bounced cheque never becomes a rejected claim."],
["Premium rules","A client is 5 days late on a premium. What is the honest advice?",["Hide the lapse risk","Explain the grace period and lapse risk, and help him pay on time","Pay it from your own pocket secretly"],1,"Paying a client's premium or sharing your commission is rebating, which is prohibited. Guide, remind, and follow up instead."],
["Client needs","Rohan, 28, single, asks for a child plan. What is your first step?",["Sell it immediately","Ask about dependants, income, goals and existing cover before suggesting anything","Offer the costliest plan"],1,"A needs analysis comes first: who depends on this person, what they earn and owe, and what they already hold."],
["Client needs","What is a common planning rule of thumb for term cover?",["₹1 lakh for everyone","About 10 to 15 times annual income, adjusted for loans and goals","Equal to the annual premium"],1,"It is only a starting point. Add loans, children's education and spouse's needs, then subtract existing cover."],
["Client needs","A family of four in Pune relies only on the employer's ₹5 lakh group health cover. Is there a gap?",["No gap","Group cover ends when the job does and may fall short as hospital costs rise, so suggest a personal policy","The employer covers everything"],1,"Medical costs keep rising, and employer cover is not portable. A personal base policy is security that stays."],
["Client needs","Retired Mr Sharma, 68, wants safe growth. An agent pushes a 20-year lock-in plan. Is that fair?",["Yes, the commission is higher","No, that is mis-selling. Product must fit age, need and liquidity","Yes, everyone should hold for 20 years"],1,"Mis-selling destroys clients and careers. Your reputation compounds, so sell what fits."],
["Licence and fees","Why is there an official fee to get an agent or advisor licence?",["It is a favour to the insurer","It is the regulatory registration and exam cost. It makes you legally authorised and accountable","It is the recruiter's commission"],1,"The licence lets you legally sell, builds client trust, and makes you accountable to IRDAI. Think of the fee as the price of your professional identity."],
["Licence and fees","Someone asks for ₹30,000 as a 'licence guarantee fee' into his personal account. Your verdict?",["Pay quickly before the offer ends","Red flag. Official fees go through the insurer or approved channels, with receipts","Negotiate it down"],1,"Never pay an individual for a licence. A genuine recruiter, including us, guides you to the official process and does not take licence money in a private account."],
["Licence and fees","Who generally cannot get an agent licence?",["Under 18s, people not meeting the education criteria, or those with disqualifying convictions or a previously cancelled licence","Only retirees","Only housewives"],0,"Retired people, homemakers and students who are 18 or older and meet the criteria can qualify. Always confirm current criteria with the insurer or IRDAI."],
["Licence and fees","A serving government clerk wants to sell insurance on weekends. What is the first step?",["Just start","Check the service conduct rules and get permission. Many serving employees are restricted","Use a relative's name"],1,"Serving government and some institutional employees are often restricted by service rules. Retired people are generally free to apply."],
["Staying active","Which of these keeps your licence active and your income alive?",["Renew before expiry, complete required training, follow the code of conduct","Ignore it until a client calls","Only post on social media"],0,"Licences run for a fixed term, commonly three years, and must be renewed on time. Check current rules with your insurer."],
["Staying active","A client's claim is rejected and he is upset. What do you do?",["Disappear","Help him file with the insurer's grievance team and, if unresolved, escalate via IRDAI's Bima Bharosa or the Ombudsman","Promise it will be approved"],1,"Never promise claim outcomes. Standing by the client through a hard moment turns one policy into a family of clients."],
["Today's world","A WhatsApp forward says, 'IRDAI-approved plan doubles your money in 2 years!' Your move?",["Forward it","Treat it as fake. Insurance never guarantees doubled money. Verify on the insurer or IRDAI website","Sell it"],1,"Digital fraud is rising. A trusted advisor who can tell real from fake is more valuable every year."],
["Today's world","IRDAI's 'Insurance for All by 2047' vision means what for you?",["Fewer opportunities","Many uninsured families remain, so trained, ethical advisors stay in demand","Insurance will become free"],1,"Millions of families are still under-insured. The need is the opportunity, if you are licensed, trained and honest."]],
hi:[
["IRDAI की बुनियाद","एक रिश्तेदार कहता है, 'IRDAI बीमा बेचने वाली प्राइवेट कंपनी है।' क्या यह सही है?",["हाँ","नहीं। यह सरकारी नियामक है जो एजेंट को लाइसेंस देता और पॉलिसीधारकों की रक्षा करता है","यह सिर्फ मोटर क्लेम देखता है"],1,"IRDAI यानी Insurance Regulatory and Development Authority of India, कानूनी नियामक। लाइसेंस, आचरण के नियम और पॉलिसीधारकों की सुरक्षा इसी से आते हैं।"],
["IRDAI की बुनियाद","सुनीता 'घर की ही बात है' कहकर बिना लाइसेंस चचेरे भाई की फर्म के लिए पॉलिसी बेचती है। जोखिम क्या है?",["कोई नहीं","बिना वैध लाइसेंस बेचना गैरकानूनी है, जुर्माना और भरोसे का नुकसान हो सकता है","बस चेतावनी पत्र"],1,"सिर्फ लाइसेंस प्राप्त एजेंट ही बीमा बेच सकता है। परिवार से यह नहीं बदलता, और गड़बड़ होने पर बिना लाइसेंस वाले को कोई सुरक्षा नहीं मिलती।"],
["बीमा की शाखाएँ","अर्जुन की बाइक पार्किंग से चोरी हो गई। बीमा की कौन सी शाखा भुगतान करेगी?",["जीवन बीमा","सामान्य बीमा (मोटर)","स्वास्थ्य बीमा"],1,"सामान्य बीमा चीज़ों और देनदारियों को कवर करता है: मोटर, घर, आग, यात्रा, समुद्री, फसल।"],
["बीमा की शाखाएँ","दो बच्चों और होम लोन वाले 35 साल के व्यक्ति की अचानक मृत्यु हो जाती है। परिवार की आमदनी कौन सा कवर बचाता है?",["टर्म लाइफ","यात्रा बीमा","आग बीमा"],0,"टर्म लाइफ शुद्ध सुरक्षा है। थोड़े प्रीमियम में बड़ा कवर मिलता है जो परिवार की आमदनी की जगह लेता है।"],
["बीमा की शाखाएँ","श्रीमती अय्यर को ₹4 लाख की सर्जरी करानी है। कौन सा कवर काम आएगा?",["स्वास्थ्य बीमा","समुद्री बीमा","फसल बीमा"],0,"स्वास्थ्य बीमा अस्पताल का खर्च देता है। इसे सामान्य बीमा कंपनियाँ और स्टैंडअलोन हेल्थ इंश्योरर बेचते हैं।"],
["बीमा की शाखाएँ","इनमें से कौन सा सामान्य बीमा उत्पाद नहीं है?",["घर या आग","यात्रा","टर्म लाइफ"],2,"टर्म लाइफ जीवन बीमा की शाखा है। शाखाएँ जानने से आप हर ग्राहक की ज़रूरत सही जगह रख पाते हैं।"],
["प्रीमियम के नियम","ग्राहक कहता है, 'अभी नकद ले लो, रसीद बाद में देख लेना।' आप क्या करेंगे?",["ले लेंगे और बाद में बीमा कंपनी को देंगे","भुगतान सिर्फ बीमा कंपनी के आधिकारिक माध्यम से, आधिकारिक रसीद के साथ लेंगे","अपने निजी UPI पर मँगवाएँगे"],1,"प्रीमियम बीमा कंपनी का होता है। उसे निजी खाते में या बिना आधिकारिक रसीद के कभी न लें। पैसे मिलाना लाइसेंस गँवाने का सबसे तेज़ रास्ता है।"],
["प्रीमियम के नियम","प्रीमियम के चेक या UPI भुगतान में प्राप्तकर्ता का नाम किसका होना चाहिए?",["एजेंट का","बीमा कंपनी का","एजेंट की कंपनी का"],1,"हमेशा बीमा कंपनी का। अगर पेमेंट लिंक पर आपका नाम दिखे तो रुकें और रिपोर्ट करें।"],
["प्रीमियम के नियम","राजू की कार पॉलिसी का चेक क्लियर नहीं हुआ और उसी दिन एक्सीडेंट हो गया। आम तौर पर क्या लागू होता है?",["फिर भी कवर मिलेगा","सामान्य बीमा में कवर आमतौर पर प्रीमियम मिलने के बाद ही शुरू होता है","बीमा कंपनी दोगुना देगी"],1,"सिद्धांत है 'प्रीमियम नहीं, तो जोखिम कवर नहीं'। ग्राहकों को साफ बताएँ ताकि बाउंस चेक क्लेम रद्द होने की वजह न बने।"],
["प्रीमियम के नियम","ग्राहक का प्रीमियम 5 दिन लेट है। ईमानदार सलाह क्या है?",["लैप्स के जोखिम को छुपाएँ","ग्रेस पीरियड और लैप्स का जोखिम समझाएँ और समय पर भुगतान में मदद करें","चुपके से अपनी जेब से भर दें"],1,"ग्राहक का प्रीमियम भरना या अपना कमीशन बाँटना रिबेटिंग है, जो प्रतिबंधित है। गाइड करें, याद दिलाएँ, फॉलो-अप करें।"],
["ग्राहक की ज़रूरत","रोहन, 28 साल, अविवाहित, चाइल्ड प्लान माँगता है। आपका पहला कदम?",["तुरंत बेच दें","कुछ सुझाने से पहले आश्रितों, आमदनी, लक्ष्यों और मौजूदा कवर के बारे में पूछें","सबसे महँगा प्लान दें"],1,"पहले ज़रूरत का विश्लेषण: इस व्यक्ति पर कौन निर्भर है, वह कितना कमाता और चुकाता है, और उसके पास पहले से क्या है।"],
["ग्राहक की ज़रूरत","टर्म कवर के लिए आम अंगूठे का नियम क्या है?",["सबके लिए ₹1 लाख","सालाना आमदनी का लगभग 10 से 15 गुना, कर्ज़ और लक्ष्यों के हिसाब से समायोजित","सालाना प्रीमियम के बराबर"],1,"यह सिर्फ शुरुआती बिंदु है। कर्ज़, बच्चों की पढ़ाई और जीवनसाथी की ज़रूरतें जोड़ें, फिर मौजूदा कवर घटाएँ।"],
["ग्राहक की ज़रूरत","पुणे का चार लोगों का परिवार सिर्फ कंपनी के ₹5 लाख के ग्रुप हेल्थ कवर पर निर्भर है। क्या कोई कमी है?",["कोई कमी नहीं","नौकरी जाते ही ग्रुप कवर खत्म हो जाता है और इलाज महँगा होने पर कम पड़ सकता है, इसलिए निजी पॉलिसी सुझाएँ","कंपनी सब कुछ कवर करती है"],1,"इलाज का खर्च बढ़ता रहता है और कंपनी का कवर साथ नहीं चलता। निजी बेस पॉलिसी वह सुरक्षा है जो बनी रहती है।"],
["ग्राहक की ज़रूरत","रिटायर्ड श्री शर्मा, 68, सुरक्षित बढ़त चाहते हैं। एक एजेंट 20 साल की लॉक-इन योजना थमा रहा है। क्या यह उचित है?",["हाँ, कमीशन ज़्यादा है","नहीं, यह मिस-सेलिंग है। उत्पाद उम्र, ज़रूरत और तरलता से मेल खाए","हाँ, सबको 20 साल रखना चाहिए"],1,"मिस-सेलिंग ग्राहक और करियर दोनों को बर्बाद करती है। आपकी साख चक्रवृद्धि से बढ़ती है, इसलिए वही बेचें जो फिट हो।"],
["लाइसेंस और फीस","एजेंट या एडवाइज़र लाइसेंस के लिए आधिकारिक फीस क्यों होती है?",["यह बीमा कंपनी पर एहसान है","यह नियामक पंजीकरण और परीक्षा का खर्च है। इससे आप कानूनी रूप से अधिकृत और जवाबदेह बनते हैं","यह रिक्रूटर का कमीशन है"],1,"लाइसेंस आपको कानूनी रूप से बेचने का हक देता है, ग्राहक का भरोसा बनाता है और IRDAI के प्रति जवाबदेह बनाता है। फीस को अपनी पेशेवर पहचान की कीमत समझें।"],
["लाइसेंस और फीस","कोई व्यक्ति अपने निजी खाते में ₹30,000 'लाइसेंस गारंटी फीस' माँगता है। आपका फैसला?",["ऑफर खत्म होने से पहले जल्दी भर दें","खतरे की घंटी। आधिकारिक फीस बीमा कंपनी या मान्य माध्यम से, रसीद के साथ जाती है","मोलभाव करें"],1,"लाइसेंस के लिए किसी व्यक्ति को पैसे कभी न दें। असली रिक्रूटर, हम भी, आपको आधिकारिक प्रक्रिया तक पहुँचाते हैं और निजी खाते में लाइसेंस का पैसा नहीं लेते।"],
["लाइसेंस और फीस","आम तौर पर एजेंट लाइसेंस किसे नहीं मिल सकता?",["18 से कम उम्र, शैक्षणिक मानदंड न पूरा करने वाले, अयोग्य ठहराने वाली सज़ा वाले या पहले लाइसेंस रद्द हुए लोग","सिर्फ रिटायर्ड लोग","सिर्फ गृहिणियाँ"],0,"18 या उससे ऊपर के रिटायर्ड लोग, गृहिणियाँ और छात्र मानदंड पूरे करें तो पात्र हो सकते हैं। मौजूदा नियम हमेशा बीमा कंपनी या IRDAI से पुष्टि करें।"],
["लाइसेंस और फीस","एक कार्यरत सरकारी क्लर्क सप्ताहांत में बीमा बेचना चाहता है। पहला कदम?",["बस शुरू कर दे","सेवा आचरण नियम देखे और अनुमति ले। कई कार्यरत कर्मचारियों पर पाबंदी होती है","किसी रिश्तेदार के नाम का इस्तेमाल करे"],1,"कार्यरत सरकारी और कुछ संस्थागत कर्मचारियों पर अक्सर सेवा नियमों की पाबंदी होती है। रिटायर्ड लोग आम तौर पर आवेदन कर सकते हैं।"],
["सक्रिय रहना","इनमें से क्या आपका लाइसेंस और कमाई सक्रिय रखता है?",["समाप्ति से पहले नवीनीकरण, ज़रूरी प्रशिक्षण और आचार संहिता का पालन","ग्राहक के फ़ोन करने तक अनदेखा करना","सिर्फ सोशल मीडिया पर पोस्ट करना"],0,"लाइसेंस एक तय अवधि के लिए होता है, आम तौर पर तीन साल, और समय पर नवीनीकरण ज़रूरी है। मौजूदा नियम अपनी बीमा कंपनी से जाँचें।"],
["सक्रिय रहना","ग्राहक का क्लेम रद्द हो गया और वह नाराज़ है। आप क्या करेंगे?",["गायब हो जाएँगे","बीमा कंपनी की शिकायत टीम में शिकायत दर्ज कराने में मदद करेंगे, और हल न हो तो IRDAI के बीमा भरोसा या लोकपाल तक ले जाएँगे","क्लेम पास कराने का वादा करेंगे"],1,"क्लेम के नतीजे का वादा कभी न करें। मुश्किल घड़ी में ग्राहक के साथ खड़े रहना एक पॉलिसी को पूरे परिवार का भरोसा बना देता है।"],
["आज की दुनिया","एक व्हाट्सऐप फॉरवर्ड कहता है, 'IRDAI-मान्य प्लान, 2 साल में पैसा दोगुना!' आप क्या करेंगे?",["फॉरवर्ड करेंगे","इसे फर्जी मानेंगे। बीमा कभी पैसा दोगुना होने की गारंटी नहीं देता। बीमा कंपनी या IRDAI की वेबसाइट पर जाँचें","बेचेंगे"],1,"डिजिटल धोखाधड़ी बढ़ रही है। असली और नकली पहचानने वाला भरोसेमंद सलाहकार हर साल ज़्यादा कीमती होता है।"],
["आज की दुनिया","IRDAI के 'सबके लिए बीमा 2047 तक' लक्ष्य का आपके लिए क्या मतलब है?",["अवसर कम होंगे","अभी भी करोड़ों परिवार बीमा से दूर हैं, इसलिए प्रशिक्षित और ईमानदार सलाहकारों की माँग बनी रहेगी","बीमा मुफ़्त हो जाएगा"],1,"करोड़ों परिवार अब भी कम सुरक्षित हैं। ज़रूरत ही अवसर है, बशर्ते आप लाइसेंसधारी, प्रशिक्षित और ईमानदार हों।"]]};

T.ta={"h1": "ஆழம்", "tag": "பெரும்பாலானோர் இதை ஸ்க்ரோல் செய்து கடந்து போவார்கள். சிலர் மட்டுமே அடி எடுத்து வைப்பார்கள்.", "sub": "பத்து நிமிடங்கள். உங்கள் பணம், உங்கள் நேரம், அடுத்த பத்து ஆண்டுகள் மீது ஒரு நேர்மையான பார்வை.", "stepIn": "அடி எடுத்து வையுங்கள்", "discH": "முதலில், நேர்மையான உண்மை", "disc": "GoldenRoot Successors மக்கள் உரிமம் பெற்ற காப்பீட்டு ஆலோசகர்களாக மாற உதவுகிறது. இந்த வினாடி வினா அடிப்படைகளைக் கற்பிக்கிறது, உங்கள் சொந்த எண்களைக் காட்டுகிறது, இறுதியில் நீங்கள் விரும்பினால் உங்கள் விவரங்களை எங்களுடன் பகிரலாம். இங்கே உங்களுக்கு எதுவும் விற்கப்படுவதில்லை. வருமானம் நீங்கள் செய்யும் வேலையிலிருந்து மட்டுமே வரும், எந்த உத்தரவாதமும் இல்லை.", "ok": "புரிந்தது, தொடருங்கள்", "no": "எனக்கு வேண்டாம்", "nomsg": "உங்களிடம் நீங்களே நேர்மையாக இருந்ததற்கு நன்றி. மனம் மாறினால் இந்தக் கதவு திறந்தே இருக்கும்.", "qm": "ஒவ்வொரு மாதமும் எவ்வளவு சம்பாதிக்க விரும்புகிறீர்கள்?", "qmS": "பாதுகாப்பாகத் தோன்றும் தொகையை அல்ல, உங்கள் வாழ்க்கையை மாற்றும் தொகையைத் தேர்ந்தெடுங்கள்.", "mO": ["₹25,000", "₹50,000", "₹1,00,000", "₹2,00,000 அல்லது அதற்கு மேல்"], "qy": "ஒரு வருடத்தில் எவ்வளவு சம்பாதிக்க விரும்புகிறீர்கள்?", "qyS": "நீங்கள் பயப்படும் ஆண்டை அல்ல, நீங்கள் விரும்பும் ஆண்டை நினைத்துப் பாருங்கள்.", "yO": ["₹6 முதல் 10 லட்சம்", "₹10 முதல் 25 லட்சம்", "₹25 முதல் 50 லட்சம்", "₹50 லட்சம் அல்லது அதற்கு மேல்"], "qd": "எத்தனை பேர் பொருளாதார ரீதியாக உங்களைச் சார்ந்திருக்கிறார்கள்?", "qdS": "குழந்தைகள், பெற்றோர், வாழ்க்கைத் துணை. அவர்களின் எதிர்காலம் உங்கள் வருமானத்தில் ஓடுகிறது.", "dO": ["யாரும் இல்லை", "1 அல்லது 2", "3 அல்லது 4", "5 அல்லது அதற்கு மேல்"], "qr": "எந்தக் கனவுகளுக்காக உழைக்கத் தயாராக இருக்கிறீர்கள்?", "qrS": "பொருந்துவன அனைத்தையும் தேர்ந்தெடுங்கள்.", "rO": ["குடும்பத்துடன் வெளிநாட்டுச் சுற்றுலா", "சொந்தக் கார்", "என் கனவு வீடு", "குழந்தைகளுக்குச் சிறந்த கல்வி", "யாரிடமும் பணம் கேட்க வேண்டிய அவசியமில்லாத நிலை"], "rDef": "பொருளாதார சுதந்திரம்", "cont": "தொடர்க", "fH": "உங்கள் பணம், எளிய எண்களில்", "fS": "மதிப்பீடுகளும் போதும். நீங்கள் பகிர முடிவு செய்யும் வரை இந்தத் தகவல் ்தது. பொதுவாக என்ன பொருந்தும்?", ["இருந்தாலும் காப்பீடு கிடைக்கும்", "பொதுக் காப்பீட்டில் பிரீமியம் பெறப்பட்ட பிறகுதான் பொதுவாகப் பாதுகாப்பு தொடங்கும்", "காப்பீட்டு நிறுவனம் இரட்டிப்பு தரும்"], 1, "கொள்கை: 'பிரீமியம் இல்லையெனில் ஆபத்துப் பாதுகாப்பு இல்லை'. வாடிக்கையாளருக்குத் தெளிவாகச் சொல்லுங்கள்."], ["பிரீமியம் விதிகள்", "வாடிக்கையாளரின் பிரீமியம் 5 நாள் தாமதம். நேர்மையான ஆலோசனை எது?", ["காலாவதி ஆபத்தை மறைப்பது", "சலுகைக் காலம், காலாவதி ஆபத்தை விளக்கி, சரியான நேரத்தில் செலுத்த உதவுவது", "என் பாக்கெட்டிலிருந்து ரகசியமாகச் செலுத்துவது"], 1, "வாடிக்கையாளர் பிரீமியத்தைச் செலுத்துவது அல்லது கமிஷனைப் பகிர்வது ரிபேட்டிங், அது தடை செய்யப்பட்டது."], ["வாடிக்கையாளர் தேவை", "ரோஹன், 28, திருமணமாகாதவர், குழந்தைத் திட்டம் கேட்கிறார். உங்கள் முதல் படி?", ["உடனே விற்பது", "எதையும் பரிந்துரைக்கும் முன் சார்ந்திருப்பவர்கள், வருமானம், இலக்குகள், தற்போதைய காப்பீடு பற்றிக் கேட்பது", "மிக விலை உயர்ந்த திட்டத்தைத் தருவது"], 1, "முதலில் தேவைப் பகுப்பாய்வு: யார் சார்ந்திருக்கிறார்கள், வருமானம், கடன், ஏற்கனவே என்ன உள்ளது."], ["வாடிக்கையாளர் தேவை", "டேர்ம் காப்பீட்டுக்கான பொதுவான கணிப்பு விதி எது?", ["அனைவருக்கும் ₹1 லட்சம்", "ஆண்டு வருமானத்தின் சுமார் 10 முதல் 15 மடங்கு, கடன்கள் மற்றும் இலக்குகளுக்கு ஏற்ப மாற்றம்", "ஆண்டு பிரீமியத்துக்குச் சமம்"], 1, "இது தொடக்கப் புள்ளி மட்டுமே. கடன், குழந்தைகள் கல்வியைச் சேர்த்து, தற்போதைய காப்பீட்டைக் கழியுங்கள்."], ["வாடிக்கையாளர் தேவை", "புனேயில் நான்கு பேர் கொண்ட குடும்பம் நிறுவனத்தின் ₹5 லட்சம் குழு மருத்துவக் காப்பீட்டை மட்டுமே நம்பியுள்ளது. பற்றாக்குறை உள்ளதா?", ["இல்லை", "வேலை போனால் குழுக் காப்பீடு முடிந்துவிடும், சிகிச்சைச் செலவு உயர்ந்தால் போதாது; எனவே தனிப் பாலிசி பரிந்துரைக்கவும்", "நிறுவனம் எல்லாவற்றையும் காக்கும்"], 1, "மருத்துவச் செலவு உயர்ந்துகொண்டே இருக்கும்; நிறுவனக் காப்பீடு உங்களுடன் வராது."], ["வாடிக்கையாளர் தேவை", "ஓய்வு பெற்ற திரு சர்மா, 68, பாதுகாப்பான வளர்ச்சி விரும்புகிறார். ஒரு முகவர் 20 ஆண்டு லாக்-இன் திட்டத்தைத் தள்ளுகிறார். சரியா?", ["ஆம், கமிஷன் அதிகம்", "இல்லை, இது தவறான விற்பனை. தயாரிப்பு வயது, தேவை, பணப்புழக்கத்துக்கு ஏற்ப இருக்க வேண்டும்", "ஆம், எல்லோரும் 20 ஆண்டு வைத்திருக்க வேண்டும்"], 1, "தவறான விற்பனை வாடிக்கையாளரையும் தொழிலையும் அழிக்கும். பொருத்தமானதையே விற்கவும்."], ["உரிமமும் கட்டணமும்", "முகவர் அல்லது ஆலோசகர் உரிமத்துக்கு அதிகாரப்பூர்வக் கட்டணம் ஏன்?", ["இது காப்பீட்டு நிறுவனத்துக்குச் செய்யும் உதவி", "இது ஒழுங்குமுறைப் பதிவு மற்றும் தேர்வுச் செலவு; உங்களைச் சட்டப்படி அங்கீகரிக்கப்பட்டவராகவும் பொறுப்புள்ளவராகவும் ஆக்குகிறது", "இது ஆள் சேர்ப்பவரின் கமிஷன்"], 1, "உரிமம் சட்டப்படி விற்கும் உரிமையைத் தருகிறது, வாடிக்கையாளர் நம்பிக்கையை உருவாக்குகிறது. கட்டணத்தை உங்கள் தொழில் அடையாளத்தின் விலையாகக் கருதுங்கள்."], ["உரிமமும் கட்டணமும்", "ஒருவர் தம் தனிக் கணக்கில் ₹30,000 'உரிம உத்தரவாதக் கட்டணம்' கேட்கிறார். உங்கள் முடிவு?", ["சலுகை முடியும் முன் விரைவாகச் செலுத்துவேன்", "ஆபத்தின் அறிகுறி. அதிகாரப்பூர்வக் கட்டணம் காப்பீட்டு நிறுவனம் அல்லது அங்கீகரிக்கப்பட்ட வழி மூலம், ரசீதுடன் செல்லும்", "பேரம் பேசுவேன்"], 1, "உரிமத்துக்காகத் தனிநபருக்குப் பணம் தராதீர்கள். நாங்களும் தனிக் கணக்கில் உரிமப் பணம் வாங்குவதில்லை."], ["உரிமமும் கட்டணமும்", "பொதுவாக முகவர் உரிமம் யாருக்குக் கிடைக்காது?", ["18 வயதுக்குக் குறைந்தவர்கள், கல்வித் தகுதி இல்லாதவர்கள், தகுதியிழக்கச் செய்யும் தண்டனை பெற்றவர்கள் அல்லது முன்பு உரிமம் ரத்தானவர்கள்", "ஓய்வு பெற்றவர்கள் மட்டும்", "இல்லத்தரசிகள் மட்டும்"], 0, "18 வயது அல்லது அதற்கு மேல் உள்ள ஓய்வு பெற்றோர், இல்லத்தரசிகள், மாணவர்கள் தகுதி பெற்றால் விண்ணப்பிக்கலாம். தற்போதைய விதிகளைக் காப்பீட்டு நிறுவனம் அல்லது IRDAI-யிடம் உறுதிசெய்யுங்கள்."], ["உரிமமும் கட்டணமும்", "பணியில் உள்ள அரசு எழுத்தர் வார இறுதியில் காப்பீடு விற்க விரும்புகிறார். முதல் படி?", ["சும்மா தொடங்குவது", "பணி நடத்தை விதிகளைப் பார்த்து அனுமதி பெறுவது. பணியில் உள்ள பலருக்குக் கட்டுப்பாடு உண்டு", "உறவினர் பெயரைப் பயன்படுத்துவது"], 1, "பணியில் உள்ள அரசு மற்றும் சில நிறுவன ஊழியர்களுக்குப் பெரும்பாலும் கட்டுப்பாடு உண்டு. ஓய்வு பெற்றோர் பொதுவாக விண்ணப்பிக்கலாம்."], ["செயலில் இருத்தல்", "உங்கள் உரிமத்தையும் வருமானத்தையும் செயலில் வைத்திருப்பது எது?", ["காலாவதிக்கு முன் புதுப்பித்தல், தேவையான பயிற்சி, நடத்தை நெறி", "வாடிக்கையாளர் அழைக்கும் வரை கவனிக்காமல் இருப்பது", "சமூக ஊடகத்தில் மட்டும் பதிவிடுவது"], 0, "உரிமம் ஒரு குறிப்பிட்ட காலத்துக்கு, பொதுவாக மூன்று ஆண்டுகள், சரியான நேரத்தில் புதுப்பிக்க வேண்டும். தற்போதைய விதிகளைச் சரிபாருங்கள்."], ["செயலில் இருத்தல்", "வாடிக்கையாளரின் கிளைம் நிராகரிக்கப்பட்டு அவர் வருத்தத்தில் உள்ளார். என்ன செய்வீர்கள்?", ["மறைந்துவிடுவேன்", "காப்பீட்டு நிறுவனக் குறைதீர் பிரிவில் புகார் அளிக்க உதவி, தீராவிட்டால் IRDAI-யின் பீமா பரோசா அல்லது ஒம்புட்ஸ்மேனுக்குக் கொண்டு செல்வேன்", "கிளைம் ஒப்புதல் பெற்றுத் தருவதாக வாக்களிப்பேன்"], 1, "கிளைம் முடிவு குறித்து வாக்களிக்காதீர்கள். கடினமான நேரத்தில் உடனிருப்பது நம்பிக்கையை வளர்க்கும்."], ["இன்றைய உலகம்", "ஒரு வாட்ஸ்அப் ஃபார்வர்டு, 'IRDAI அங்கீகரித்த திட்டம், 2 ஆண்டில் பணம் இரட்டிப்பு!' என்கிறது. என்ன செய்வீர்கள்?", ["ஃபார்வர்டு செய்வேன்", "போலி எனக் கருதுவேன். காப்பீடு பணம் இரட்டிப்பாகும் என்று உத்தரவாதம் தராது. நிறுவனம் அல்லது IRDAI இணையதளத்தில் சரிபார்ப்பேன்", "விற்பேன்"], 1, "டிஜிட்டல் மோசடி அதிகரிக்கிறது. உண்மை எது போலி எது என அறியும் நம்பகமான ஆலோசகர் ஆண்டுதோறும் மதிப்பு பெறுகிறார்."], ["இன்றைய உலகம்", "IRDAI-யின் '2047-க்குள் அனைவருக்கும் காப்பீடு' இலக்கு உங்களுக்கு என்ன பொருள்?", ["வாய்ப்புகள் குறையும்", "இன்னும் கோடிக்கணக்கான குடும்பங்கள் காப்பீடின்றி உள்ளன; பயிற்சி பெற்ற நேர்மையான ஆலோசகர்களுக்குத் தேவை நீடிக்கும்", "காப்பீடு இலவசமாகிவிடும்"], 1, "கோடிக்கணக்கான குடும்பங்கள் இன்னும் போதுமான பாதுகாப்பின்றி உள்ளன. தேவையே வாய்ப்பு, நீங்கள் உரிமம் பெற்று, பயிற்சி பெற்று, நேர்மையாக இருந்தால்."]];PAUSE[5].ta=["நேர்மையாக", "நேற்று எத்தனை மணி நேரம் எதையும் உருவாக்காமல் ஃபோனில் கழிந்தது?", ["1 மணி நேரத்துக்குக் குறைவு", "1 முதல் 3 மணி நேரம்", "3 மணி நேரத்துக்கு மேல்"], "அந்த நேரம் மூலப்பொருள். தினமும் இரண்டு மணி நேரக் கவனம், ஆண்டில் 700 மணிநேரத்துக்கும் மேலான திறன், ஒரு தொழிலைக் கற்க போதும்."];PAUSE[13].ta=["கற்பனை செய்யுங்கள்", "12 மாதங்களுக்குப் பிறகும் எதுவும் மாறவில்லை என்று நினைத்துப் பாருங்கள். எப்படி இருக்கிறது?", ["சரிதான்", "அமைதியின்மை", "ஏற்க முடியாது"], "அமைதியின்மை பயனுள்ளது. முன்னேற முடிவு செய்துவிட்ட உங்கள் ஒரு பகுதியின் குரல் அது."];PAUSE[17].ta=["உங்கள் தரம்", "உங்கள் கனவுக்காக முதலில் எதை விட்டுக்கொடுக்கத் தயார்?", ["சிறிது ஓய்வு நேரம்", "சிறிது வசதி", "சாக்குப்போக்குகள்"], "நீங்கள் மதிக்கும் சாதனையாளர்களும் இதையே விட்டுக்கொடுத்தனர். நின்றுவிடுவதன் விலைக்கு முன் தொடக்கத்தின் விலை சிறியது."];
T.te={"h1": "లోతు", "tag": "చాలామంది దీన్ని స్క్రోల్ చేసి దాటిపోతారు. కొందరు మాత్రమే అడుగు ముందుకు వేస్తారు.", "sub": "పది నిమిషాలు. మీ డబ్బు, మీ సమయం, రాబోయే పదేళ్లపై ఒక నిజాయితీ చూపు.", "stepIn": "అడుగు వేయండి", "discH": "ముందుగా, నిజాయితీ మాట", "disc": "GoldenRoot Successors ప్రజలు లైసెన్స్ పొందిన బీమా సలహాదారులు కావడానికి సహాయపడుతుంది. ఈ క్విజ్ ప్రాథమికాలు నేర్పుతుంది, మీ సొంత అంకెలను చూపిస్తుంది, చివర్లో మీరు కోరితే మీ వివరాలను మాతో పంచుకోవచ్చు. ఇక్కడ మీకు ఏదీ అమ్మడం లేదు. ఆదాయం మీరు చేసే పని నుంచే వస్తుంది, ఎలాంటి హామీ లేదు.", "ok": "అర్థమైంది, కొనసాగండి", "no": "నాకు వద్దు", "nomsg": "మీతో మీరు నిజాయితీగా ఉన్నందుకు ధన్యవాదాలు. మనసు మారితే ఈ తలుపు తెరిచే ఉంటుంది.", "qm": "ప్రతి నెలా ఎంత సంపాదించాలనుకుంటున్నారు?", "qmS": "సురక్షితంగా అనిపించే మొత్తాన్ని కాదు, మీ జీవితాన్ని మార్చే మొత్తాన్ని ఎంచుకోండి.", "mO": ["₹25,000", "₹50,000", "₹1,00,000", "₹2,00,000 లేదా ఎక్కువ"], "qy": "ఒక సంవత్సరంలో ఎంత సంపాదించాలనుకుంటున్నారు?", "qyS": "మీరు భయపడే సంవత్సరాన్ని కాదు, మీరు కోరుకునే సంవత్సరాన్ని ఊహించండి.", "yO": ["₹6 నుంచి 10 లక్షలు", "₹10 నుంచి 25 లక్షలు", "₹25 నుంచి 50 లక్షలు", "₹50 లక్షలు లేదా ఎక్కువ"], "qd": "ఎంతమంది ఆర్థికంగా మీపై ఆధారపడి ఉన్నారు?", "qdS": "పిల్లలు, తల్లిదండ్రులు, జీవిత భాగస్వామి. వారి భవిష్యత్తు మీ ఆదాయంపై నడుస్తుంది.", "dO": ["ఎవరూ లేరు", "1 లేదా 2", "3 లేదా 4", "5 లేదా ఎక్కువ"], "qr": "ఏ కలల కోసం కష్టపడటానికి సిద్ధంగా ఉన్నారు?", "qrS": "వర్తించేవన్నీ ఎంచుకోండి.", "rO": ["కుటుంబంతో విదేశీ ప్రయాణం", "సొంత కారు", "నా కలల ఇల్లు", "పిల్లలకు ఉత్తమ విద్య", "ఎవరినీ డబ్బు అడగాల్సిన అవసరం లేని స్థితి"], "rDef": "ఆర్థిక స్వేచ్ఛ", "cont": "కొనసాగండి", "fH": "మీ డబ్బు, సరళమైన అంకెల్లో", "fS": "అంచనాలు చాలు. మీరు పంచుకోవాలని నిర్ణయించుకునే వరకు ఈ సమాచారం ఈ క్విజ్‌లోనే ఉంటుంది.", "fl": ["మీ మొత్తం వార్షిక ఆదాయం (₹, లేకపోతే 0)", "మీ మొత్తం వార్షిక ఖర్చు (₹)", "మీ ప్రస్తుత జీవిత బీమా కవర్ (₹, లేకపోతే 0)", "మీ ప్రస్తుత వైద్య బీమా కవర్ (₹, లేకపోతే 0)"], "fBtn": "నా వాస్తవాన్ని చూపించండి", "fErr": "సరైన అంకెలు నమోదు చేయండి. ఖర్చు 0 కంటే ఎక్కువ ఉండాలి.", "rH": "మీ వా ఈరోజు ఇంకొంచెం దగ్గరయ్యాయి.", "ఇప్పుడు కొత్త ఆలోచన మొదలవుతుంది: నేను నేర్చుకోగలను. నేను ఎదగగలను. నేను నిర్మించగలను.", "ప్రతి నిజాయితీ సంభాషణతో నైపుణ్యం పెరుగుతుంది, దానితో పాటు మీ ఆత్మవిశ్వాసం కూడా.", "ఈ పేజీని తెరిచిన వ్యక్తి వేరు, ఇప్పుడున్న మీరు వేరు.", "తలుపు తెరిచే ఉంది, మీరు ఇప్పటికే అందులోంచి నడుస్తున్నారు.", "విజయం ఒక్కో స్థిరమైన రోజుతో నిర్మితమవుతుంది, ఈరోజు మీరు మొదటి రాయి వేశారు. మీ ఆరంభానికి స్వాగతం."], "listen": "వినండి", "stop": "ఆపు"};QL.te=[["IRDAI ప్రాథమికాలు", "ఒక బంధువు, 'IRDAI అనేది బీమా అమ్మే ప్రైవేట్ కంపెనీ' అంటాడు. ఇది సరైనదేనా?", ["అవును", "కాదు. ఇది ప్రభుత్వ నియంత్రణ సంస్థ; ఏజెంట్లకు లైసెన్స్ ఇచ్చి పాలసీదారులను కాపాడుతుంది", "ఇది మోటార్ క్లెయిమ్‌లను మాత్రమే చూస్తుంది"], 1, "IRDAI చట్టబద్ధ నియంత్రణ సంస్థ. లైసెన్స్, ప్రవర్తనా నియమాలు, పాలసీదారుల రక్షణ అన్నీ దీని నుంచే వస్తాయి."], ["IRDAI ప్రాథమికాలు", "సునీత 'ఇంట్లో వాళ్లే కదా' అని లైసెన్స్ లేకుండా బంధువు సంస్థ కోసం పాలసీలు అమ్ముతోంది. ప్రమాదం ఏమిటి?", ["ఏమీ లేదు", "చెల్లుబాటయ్యే లైసెన్స్ లేకుండా అమ్మడం చట్టవిరుద్ధం; జరిమానా, నమ్మకం కోల్పోవడం జరగవచ్చు", "కేవలం హెచ్చరిక లేఖ"], 1, "లైసెన్స్ ఉన్న ఏజెంట్ మాత్రమే బీమా అమ్మగలడు. కుటుంబం అయినా ఇది మారదు."], ["బీమా శాఖలు", "అర్జున్ బైక్ పార్కింగ్ నుంచి దొంగిలించబడింది. ఏ శాఖ చెల్లిస్తుంది?", ["జీవిత", "సాధారణ (మోటార్)", "ఆరోగ్య"], 1, "సాధారణ బీమా వస్తువులు, బాధ్యతలను కవర్ చేస్తుంది: మోటార్, ఇల్లు, అగ్ని, ప్రయాణం, పంట."], ["బీమా శాఖలు", "ఇద్దరు పిల్లలు, గృహ రుణం ఉన్న 35 ఏళ్ల వ్యక్తి అకస్మాత్తుగా మరణిస్తాడు. కుటుంబ ఆదాయాన్ని ఏ కవర్ కాపాడుతుంది?", ["టర్మ్ లైఫ్", "ప్రయాణ బీమా", "అగ్ని బీమా"], 0, "టర్మ్ లైఫ్ స్వచ్ఛమైన రక్షణ. తక్కువ ప్రీమియంతో పెద్ద కవర్ లభిస్తుంది."], ["బీమా శాఖలు", "శ్రీమతి అయ్యర్‌కు ₹4 లక్షల శస్త్రచికిత్స అవసరం. ఏ కవర్ ఉపయోగపడుతుంది?", ["ఆరోగ్య బీమా", "సముద్ర బీమా", "పంట బీమా"], 0, "ఆరోగ్య బీమా ఆసుపత్రి ఖర్చును భరిస్తుంది."], ["బీమా శాఖలు", "వీటిలో ఏది సాధారణ బీమా ఉత్పత్తి కాదు?", ["ఇల్లు లేదా అగ్ని", "ప్రయాణం", "టర్మ్ లైఫ్"], 2, "టర్మ్ లైఫ్ జీవిత బీమా శాఖకు చెందినది."], ["ప్రీమియం నియమాలు", "కస్టమర్, 'ఇప్పుడు నగదు తీసుకోండి, రసీదు తర్వాత చూద్దాం' అంటాడు. మీరు ఏం చేస్తారు?", ["తీసుకుని తర్వాత బీమా కంపెనీకి ఇస్తాను", "బీమా కంపెనీ అధికారిక మార్గంలో, అధికారిక రసీదుతో మాత్రమే తీసుకుంటాను", "నా వ్యక్తిగత UPIకి పంపమంటాను"], 1, "ప్రీమియం బీమా కంపెనీది. వ్యక్తిగత ఖాతాలో లేదా అధికారిక రసీదు లేకుండా ఎప్పుడూ తీసుకోవద్దు."], ["ప్రీమియం నియమాలు", "ప్రీమియం చెక్ లేదా UPI చెల్లింపులో గ్రహీత పేరు ఎవరిది ఉండాలి?", ["ఏజెంట్‌ది", "బీమా కంపెనీది", "ఏజెంట్ కంపెనీది"], 1, "ఎప్పుడూ బీమా కంపెనీదే. లింక్‌లో మీ పేరు కనిపిస్తే ఆగి, ఫిర్యాదు చేయండి."], ["ప్రీమియం నియమాలు", "రాజు కారు పాలసీ చెక్ క్లియర్ కాలేదు, అదే రోజు ప్రమాదం జరిగింది. సాధారణంగా ఏది వర్తిస్తుంది?", ["అయినా కవర్ ఉంటుంది", "సాధారణ బీమాలో ప్రీమియం అందిన తర్వాతే సాధారణంగా రక్షణ మొదలవుతుంది", "బీమా కంపెనీ రెట్టింపు ఇస్తుంది"], 1, "సూత్రం: 'ప్రీమియం లేకపోతే రిస్క్ కవర్ లేదు'. కస్టమర్లకు స్పష్టంగా చెప్పండి."], ["ప్రీమియం నియమాలు", "కస్టమర్ ప్రీమియం 5 రోజులు ఆలస్యం. నిజాయితీ సలహా ఏది?", ["లాప్స్ ప్రమాదాన్ని దాచడం", "గ్రేస్ పీరియడ్, లాప్స్ ప్రమాదం వివరించి, సమయానికి చెల్లించేందుకు సహాయపడటం", "నా జేబు నుంచి రహస్యంగా చెల్లించడం"], 1, "కస్టమర్ ప్రీమియం చెల్లించడం లేదా కమిషన్ పంచడం రిబేటింగ్, ఇది నిషేధం."], ["కస్టమర్ అవసరం", "రోహన్, 28, అవివాహితుడు, చైల్డ్ ప్లాన్ అడుగుతాడు. మీ మొదటి అడుగు?", ["వెంటనే అమ్మడం", "ఏదైనా సూచించే ముందు ఆధారపడినవారు, ఆదాయం, లక్ష్యాలు, ప్రస్తుత కవర్ గురించి అడగడం", "అత్యంత ఖరీదైన ప్లాన్ ఇవ్వడం"], 1, "ముందు అవసరాల విశ్లేషణ: ఎవరు ఆధారపడ్డారు, ఆదాయం, అప్పు, ఇప్పటికే ఏముంది."], ["కస్టమర్ అవసరం", "టర్మ్ కవర్‌కు సాధారణ అంచనా నియమం ఏది?", ["అందరికీ ₹1 లక్ష", "వార్షిక ఆదాయానికి సుమారు 10 నుంచి 15 రెట్లు, రుణాలు, లక్ష్యాలకు తగ్గట్టు సర్దుబాటు", "వార్షిక ప్రీమియంతో సమానం"], 1, "ఇది ఆరంభ బిందువు మాత్రమే. రుణాలు, పిల్లల చదువు కలిపి, ప్రస్తుత కవర్ తీసివేయండి."], ["కస్టమర్ అవసరం", "పుణేలో నలుగురి కుటుంబం కంపెనీ ₹5 లక్షల గ్రూప్ ఆరోగ్య కవర్‌పైనే ఆధారపడింది. లోటు ఉందా?", ["లేదు", "ఉద్యోగం పోతే గ్రూప్ కవర్ ముగుస్తుంది, వైద్య ఖర్చులు పెరిగితే సరిపోదు; అందుకే వ్యక్తిగత పాలసీ సూచించండి", "కంపెనీ అన్నీ కవర్ చేస్తుంది"], 1, "వైద్య ఖర్చులు పెరుగుతూనే ఉంటాయి; కంపెనీ కవర్ మీతో రాదు."], ["కస్టమర్ అవసరం", "రిటైర్డ్ శ్రీ శర్మ, 68, సురక్షిత వృద్ధి కోరుతున్నారు. ఒక ఏజెంట్ 20 ఏళ్ల లాక్-ఇన్ ప్లాన్ అంటగడుతున్నాడు. ఇది సరైనదేనా?", ["అవును, కమిషన్ ఎక్కువ", "కాదు, ఇది మిస్-సెల్లింగ్. ఉత్పత్తి వయస్సు, అవసరం, ద్రవ్యతకు సరిపోవాలి", "అవును, అందరూ 20 ఏళ్లు ఉంచాలి"], 1, "మిస్-సెల్లింగ్ కస్టమర్‌ను, కెరీర్‌ను నాశనం చేస్తుంది. సరిపోయేదాన్నే అమ్మండి."], ["లైసెన్స్ మరియు ఫీజు", "ఏజెంట్ లేదా సలహాదారు లైసెన్స్‌కు అధికారిక ఫీజు ఎందుకు ఉంటుంది?", ["ఇది బీమా కంపెనీకి చేసే మేలు", "ఇది నియంత్రణ నమోదు, పరీక్ష ఖర్చు; మిమ్మల్ని చట్టబద్ధంగా అధికారం ఉన్నవారిగా, జవాబుదారీగా చేస్తుంది", "ఇది నియమించేవారి కమిషన్"], 1, "లైసెన్స్ చట్టబద్ధంగా అమ్మే హక్కు ఇస్తుంది, కస్టమర్ నమ్మకాన్ని పెంచుతుంది. ఫీజును మీ వృత్తి గుర్తింపు ధరగా భావించండి."], ["లైసెన్స్ మరియు ఫీజు", "ఒకరు తన వ్యక్తిగత ఖాతాలో ₹30,000 'లైసెన్స్ గ్యారంటీ ఫీజు' అడుగుతున్నాడు. మీ నిర్ణయం?", ["ఆఫర్ ముగిసేలోపు త్వరగా చెల్లిస్తాను", "ప్రమాద సూచన. అధికారిక ఫీజు బీమా కంపెనీ లేదా ఆమోదిత మార్గంలో, రసీదుతో వెళ్తుంది", "బేరమాడతాను"], 1, "లైసెన్స్ కోసం వ్యక్తికి డబ్బు ఎప్పుడూ ఇవ్వవద్దు. మేము కూడా వ్యక్తిగత ఖాతాలో లైసెన్స్ డబ్బు తీసుకోం."], ["లైసెన్స్ మరియు ఫీజు", "సాధారణంగా ఏజెంట్ లైసెన్స్ ఎవరికి లభించదు?", ["18 ఏళ్లలోపు వారు, విద్యార్హత లేనివారు, అనర్హత కలిగించే శిక్ష పొందినవారు లేదా గతంలో లైసెన్స్ రద్దయినవారు", "రిటైర్డ్ వారు మాత్రమే", "గృహిణులు మాత్రమే"], 0, "18 లేదా ఎక్కువ వయస్సు ఉన్న రిటైర్డ్ వారు, గృహిణులు, విద్యార్థులు అర్హతలు తీరిస్తే అర్హులు కావచ్చు. ప్రస్తుత నియమాలను బీమా కంపెనీ లేదా IRDAI నుంచి నిర్ధారించుకోండి."], ["లైసెన్స్ మరియు ఫీజు", "సర్వీసులో ఉన్న ప్రభుత్వ గుమాస్తా వారాంతంలో బీమా అమ్మాలనుకుంటున్నాడు. మొదటి అడుగు?", ["నేరుగా మొదలుపెట్టడం", "సర్వీస్ ప్రవర్తనా నియమాలు చూసి అనుమతి తీసుకోవడం. సర్వీసులో ఉన్న చాలామందిపై ఆంక్షలు ఉంటాయి", "బంధువు పేరు వాడడం"], 1, "సర్వీసులో ఉన్న ప్రభుత్వ, కొన్ని సంస్థల ఉద్యోగులపై తరచూ ఆంక్షలు ఉంటాయి. రిటైర్డ్ వారు సాధారణంగా దరఖాస్తు చేయవచ్చు."], ["యాక్టివ్‌గా ఉండటం", "మీ లైసెన్స్‌ను, ఆదాయాన్ని యాక్టివ్‌గా ఉంచేది ఏది?", ["గడువుకు ముందే పునరుద్ధరణ, అవసరమైన శిక్షణ, ప్రవర్తనా నియమావళి పాటించడం", "కస్టమర్ ఫోన్ చేసే వరకు పట్టించుకోకపోవడం", "సోషల్ మీడియాలో మాత్రమే పోస్ట్ చేయడం"], 0, "లైసెన్స్ నిర్ణీత కాలానికి, సాధారణంగా మూడేళ్లు, సమయానికి పునరుద్ధరించాలి. ప్రస్తుత నియమాలు మీ బీమా కంపెనీ నుంచి తెలుసుకోండి."], ["యాక్టివ్‌గా ఉండటం", "కస్టమర్ క్లెయిమ్ తిరస్కరించబడింది, అతను బాధపడుతున్నాడు. మీరు ఏం చేస్తారు?", ["మాయమవుతాను", "బీమా కంపెనీ ఫిర్యాదు విభాగంలో ఫిర్యాదు చేయడానికి సహాయపడతాను, పరిష్కారం కాకపోతే IRDAI బీమా భరోసా లేదా అంబుడ్స్‌మన్ వరకు తీసుకెళ్తాను", "క్లెయిమ్ ఆమోదం ఇప్పిస్తానని వాగ్దానం చేస్తాను"], 1, "క్లెయిమ్ ఫలితంపై వాగ్దానం చేయవద్దు. కష్టకాలంలో కస్టమర్‌కు తోడుగా ఉండటం నమ్మకాన్ని పెంచుతుంది."], ["నేటి ప్రపంచం", "ఒక వాట్సాప్ ఫార్వర్డ్: 'IRDAI ఆమోదిత ప్లాన్, 2 ఏళ్లలో డబ్బు రెట్టింపు!' మీరు ఏం చేస్తారు?", ["ఫార్వర్డ్ చేస్తాను", "నకిలీగా భావిస్తాను. బీమా డబ్బు రెట్టింపు అవుతుందని హామీ ఇవ్వదు. కంపెనీ లేదా IRDAI వెబ్‌సైట్‌లో ధృవీకరిస్తాను", "అమ్ముతాను"], 1, "డిజిటల్ మోసాలు పెరుగుతున్నాయి. నిజమేదో నకిలీ ఏదో గుర్తించే నమ్మకమైన సలహాదారు ఏటా విలువైనవాడవుతాడు."], ["నేటి ప్రపంచం", "IRDAI 'అందరికీ బీమా 2047 నాటికి' లక్ష్యం మీకు అర్థం ఏమిటి?", ["అవకాశాలు తగ్గుతాయి", "ఇంకా కోట్ల కుటుంబాలు బీమా పరిధిలో లేవు; శిక్షణ పొందిన నిజాయితీ సలహాదారులకు డిమాండ్ కొనసాగుతుంది", "బీమా ఉచితమవుతుంది"], 1, "కోట్ల కుటుంబాలకు ఇంకా తగిన రక్షణ లేదు. అవసరమే అవకాశం, మీరు లైసెన్స్ పొంది, శిక్షణ పొంది, నిజాయితీగా ఉంటే."]];PAUSE[5].te=["నిజాయితీగా", "నిన్న ఎన్ని గంటలు ఏమీ నిర్మించకుండా ఫోన్‌లో గడిచాయి?", ["1 గంట కన్నా తక్కువ", "1 నుంచి 3 గంటలు", "3 గంటల కన్నా ఎక్కువ"], "ఆ సమయం ముడిసరుకు. రోజూ రెండు గంటల ఏకాగ్రత, ఏడాదిలో 700 గంటలకు పైగా నైపుణ్యం, ఒక వృత్తి నేర్చుకోవడానికి సరిపోతుంది."];PAUSE[13].te=["ఊహించండి", "12 నెలల తర్వాత కూడా ఏమీ మారలేదని ఊహించండి. ఎలా అనిపిస్తోంది?", ["బాగానే ఉంది", "అశాంతి", "ఆమోదయోగ్యం కాదు"], "అశాంతి ఉపయోగకరం. ముందుకు సాగాలని నిర్ణయించుకున్న మీలోని భాగం ఆ స్వరం."];PAUSE[17].te=["మీ ప్రమాణం", "మీ కల కోసం మొదట దేన్ని వదులుకోవడానికి సిద్ధం?", ["కొంత ఖాళీ సమయం", "కొంత సౌకర్యం", "సాకులు"], "మీరు మెచ్చే సంపాదనాపరులు కూడా ఇవే వదులుకున్నారు. ఆగిపోవడం ధర ముందు ఆరంభ
